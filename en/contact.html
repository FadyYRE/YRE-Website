<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Y/RE Development</title>
<meta name="description" content="Have a project, site or idea? Send a request to Y/RE Development and we will get back to you.">
<link rel="canonical" href="https://yre-development.nl/en/contact">
<link rel="alternate" hreflang="en" href="https://yre-development.nl/en/contact">
<link rel="alternate" hreflang="nl" href="https://yre-development.nl/contact">
<link rel="alternate" hreflang="x-default" href="https://yre-development.nl/contact">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Y/RE Development">
<meta property="og:title" content="Contact — Y/RE Development">
<meta property="og:description" content="Have a project, site or idea? Send a request to Y/RE Development and we will get back to you.">
<meta property="og:url" content="https://yre-development.nl/en/contact">
<meta property="og:image" content="https://yre-development.nl/assets/share-image.png">
<meta property="og:locale" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F3F1EC">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/archivo-var.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="/assets/fonts/instrument-sans-var.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face{font-family:'Archivo';src:url('/assets/fonts/archivo-var.woff') format('woff');font-weight:100 900;font-stretch:62% 125%;font-style:normal;font-display:swap}
@font-face{font-family:'Instrument Sans';src:url('/assets/fonts/instrument-sans-var.woff') format('woff');font-weight:400 700;font-stretch:75% 100%;font-style:normal;font-display:swap}
body{margin:0;background:#F3F1EC}
a{color:#121211;text-decoration:none}a:hover{color:#5F5B54}
@keyframes yreUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes yreLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.yre-up{animation:yreUp 1.1s cubic-bezier(.2,.7,.1,1) both}
.yre-d1{animation-delay:.15s}.yre-d2{animation-delay:.3s}.yre-d3{animation-delay:.45s}
.yre-line{transform-origin:left center;animation:yreLine 1.3s cubic-bezier(.7,0,.2,1) .2s both}
.yre-arrow{display:inline-block;transition:transform .5s cubic-bezier(.2,.7,.1,1)}
a:hover .yre-arrow,button:hover .yre-arrow{transform:translateX(6px)}
.yre-field{display:flex;flex-direction:column;gap:10px;min-width:0}
.yre-label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#5F5B54}
.yre-input{all:unset;box-sizing:border-box;width:100%;font-family:'Instrument Sans',system-ui,sans-serif;font-size:19px;line-height:1.4;color:#121211;padding:10px 0 14px;border-bottom:1px solid #A8A399;transition:border-color .3s ease}
.yre-input:hover{border-bottom-color:#5F5B54}
.yre-input:focus{border-bottom-color:#121211;box-shadow:0 1px 0 0 #121211}
.yre-input::placeholder{color:#8C877E}
textarea.yre-input{min-height:140px;resize:vertical;white-space:pre-wrap}
select.yre-input{cursor:pointer;padding-right:28px}
.yre-input[aria-invalid="true"]{border-bottom-color:#9B2C1F}
.yre-err{font-size:13px;color:#9B2C1F}
.yre-check{width:20px;height:20px;margin:2px 0 0;accent-color:#121211;flex:none;cursor:pointer}
.yre-submit{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:16px;min-height:56px;padding:0 28px;background:#121211;color:#F3F1EC;font-size:15px;font-weight:500;letter-spacing:.04em;transition:background .3s ease}
.yre-submit:hover{background:#2E2D2A}
.yre-submit:focus-visible{outline:2px solid #121211;outline-offset:3px}
.yre-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(24px,3vw,48px);row-gap:40px}
.yre-span2{grid-column:1 / -1}
@media (max-width: 640px){.yre-form-grid{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion: reduce){.yre-up,.yre-line{animation:none}.yre-arrow,.yre-input,.yre-submit{transition:none}}
@media (max-width: 600px){.yre-nav{gap:16px!important;font-size:13px!important;width:100%}.yre-nav>span:last-child{margin-left:auto}}
@media (max-width: 760px){.yre-phases{grid-template-columns:minmax(0,1fr)!important;row-gap:14px!important}.yre-phase{flex-direction:row!important;align-items:center!important;gap:14px!important}.yre-phase>span:first-child{margin-top:0!important;flex:none}.yre-phasetrack{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding: 40px 20px; font-family: system-ui, sans-serif">This website requires JavaScript. Contact us at <a href="mailto:info@yre-development.nl">info@yre-development.nl</a>.</p></noscript>
<template id="dc-template">
<div style="font-family: 'Instrument Sans', system-ui, sans-serif; color: #121211; background: #F3F1EC; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column">

  <!-- Header -->
  <header style="width: 100%; max-width: 1440px; margin: 0 auto; padding: 28px clamp(20px, 4vw, 56px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px">
    <a href="/en" aria-label="Y/RE Development — home" style="display: flex; align-items: center">
      <img src="/assets/img/brand/mark-black.png" alt="Y/RE" style="height: 22px; width: auto; display: block">
    </a>
    <nav class="yre-nav" aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: clamp(20px, 3vw, 44px); font-size: 14px; letter-spacing: 0.02em">
      <a href="/en/projects">Projects</a>
      <a href="/en/services">Our services</a>
      <a href="/en/about">About</a>
      <a href="/en/contact" aria-current="page" style="border-bottom: 1px solid #121211; padding-bottom: 2px">Contact</a>
      <span style="display: flex; gap: 8px; color: #5F5B54; font-size: 13px"><a href="/contact" lang="nl" style="color: #5F5B54">NL</a><span aria-hidden="true">/</span><a href="#top" aria-current="true" style="color: #121211">EN</a></span>
    </nav>
  </header>

  <!-- Intro -->
  <section id="top" style="width: 100%; max-width: 1440px; margin: 0 auto; padding: clamp(56px, 8vw, 112px) clamp(20px, 4vw, 56px) 0; box-sizing: border-box">
    <div class="yre-line" style="height: 1px; background: #121211; margin: 28px 0 clamp(36px, 4vw, 56px)"></div>
    <h1 class="yre-up yre-d1" style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 500; font-stretch: 88%; font-size: clamp(46px, 7vw, 108px); line-height: 0.98; letter-spacing: -0.035em; max-width: 1100px">Have a project, site or idea? Let’s look at it together.</h1>
    <p class="yre-up yre-d2" style="margin: clamp(32px, 4vw, 48px) 0 0; max-width: 520px; font-size: 18px; line-height: 1.55">Whether you own land, invest in real estate or are looking for a development partner — leave your details and a short message, and we will get back to you.</p>
  </section>

  <!-- Form -->
  <section aria-labelledby="form-title" class="yre-up yre-d3" style="width: 100%; max-width: 1440px; margin: 0 auto; padding: clamp(80px, 9vw, 136px) clamp(20px, 4vw, 56px) 0; box-sizing: border-box">
    <div style="display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 5vw, 80px); align-items: flex-start">
      <div style="flex: 0 0 200px; display: flex; flex-direction: column; gap: 32px">
        <h2 id="form-title" style="margin: 0; font-size: 13px; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; color: #5F5B54">Send a request</h2>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #5F5B54">Or email us directly</span>
          <a href="mailto:info@yre-development.nl" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 16px; border-bottom: 1px solid #121211; align-self: flex-start">info@yre-development.nl</a>
        </div>
      </div>

      <div style="flex: 1 1 560px; min-width: 0; border-top: 1px solid #121211; padding-top: 40px">
        <sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
          <form onSubmit="{{ submit }}" novalidate="" style="margin: 0">
            <div class="yre-form-grid">
              <div class="yre-field">
                <label for="f-first" class="yre-label">First name *</label>
                <input id="f-first" class="yre-input" type="text" autocomplete="given-name" value="{{ v.first }}" onChange="{{ on.first }}" aria-invalid="{{ inv.first }}" aria-describedby="e-first">
                <sc-if value="{{ err.first }}" hint-placeholder-val="{{ false }}"><span id="e-first" class="yre-err">{{ err.first }}</span></sc-if>
              </div>
              <div class="yre-field">
                <label for="f-last" class="yre-label">Last name *</label>
                <input id="f-last" class="yre-input" type="text" autocomplete="family-name" value="{{ v.last }}" onChange="{{ on.last }}" aria-invalid="{{ inv.last }}" aria-describedby="e-last">
                <sc-if value="{{ err.last }}" hint-placeholder-val="{{ false }}"><span id="e-last" class="yre-err">{{ err.last }}</span></sc-if>
              </div>
              <div class="yre-field">
                <label for="f-email" class="yre-label">Email *</label>
                <input id="f-email" class="yre-input" type="email" autocomplete="email" value="{{ v.email }}" onChange="{{ on.email }}" aria-invalid="{{ inv.email }}" aria-describedby="e-email">
                <sc-if value="{{ err.email }}" hint-placeholder-val="{{ false }}"><span id="e-email" class="yre-err">{{ err.email }}</span></sc-if>
              </div>
              <div class="yre-field">
                <label for="f-org" class="yre-label">Organisation</label>
                <input id="f-org" class="yre-input" type="text" autocomplete="organization" value="{{ v.org }}" onChange="{{ on.org }}">
              </div>
              <div class="yre-field yre-span2">
                <label for="f-type" class="yre-label">I am a</label>
                <div style="position: relative">
                  <select id="f-type" class="yre-input" value="{{ v.type }}" onChange="{{ on.type }}">
                  <option value="">Select…</option>
                  <option value="Landowner">Landowner</option>
                  <option value="Investor">Investor</option>
                  <option value="Development partner">Development partner</option>
                  <option value="Municipality or public body">Municipality or public body</option>
                  <option value="Other">Other</option>
                </select>
                  <svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true" style="position: absolute; right: 2px; top: 50%; margin-top: -6px; pointer-events: none"><path d="M1 1l5 5 5-5" stroke="#121211" stroke-width="1.3" fill="none"></path></svg>
                </div>
              </div>
              <div class="yre-field yre-span2">
                <label for="f-msg" class="yre-label">Message *</label>
                <textarea id="f-msg" class="yre-input" rows="5" placeholder="Tell us about your project, site or idea" value="{{ v.msg }}" onChange="{{ on.msg }}" aria-invalid="{{ inv.msg }}" aria-describedby="e-msg"></textarea>
                <sc-if value="{{ err.msg }}" hint-placeholder-val="{{ false }}"><span id="e-msg" class="yre-err">{{ err.msg }}</span></sc-if>
              </div>
            </div>
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px; margin-top: 48px">
              <span style="font-size: 13px; color: #5F5B54">* Required</span>
              <button type="submit" class="yre-submit">Send request</button>
            </div>
            <sc-if value="{{ err.form }}"><p class="yre-err" role="alert" style="margin: 20px 0 0">{{ err.form }}</p></sc-if>
            <p style="margin: 24px 0 0; font-size: 13px; line-height: 1.6; color: #5F5B54">We only use your details to respond to your request. Read our <a href="/en/privacy" style="color: #121211; border-bottom: 1px solid #121211">privacy statement</a>.</p>
          </form>
        </sc-if>

        <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
          <div role="status" style="display: flex; flex-direction: column; gap: 24px; padding: 8px 0 24px">
            <span style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #5F5B54">Request sent</span>
            <p style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 500; font-stretch: 88%; font-size: clamp(32px, 3.6vw, 52px); line-height: 1.05; letter-spacing: -0.03em; max-width: 720px">Thank you, {{ v.first }}. We will get back to you shortly.</p>
            <button type="button" onClick="{{ reset }}" style="all: unset; cursor: pointer; align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 500; border-bottom: 1px solid #121211">Send another request</button>
          </div>
        </sc-if>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <section style="margin-top: auto; padding-top: clamp(112px, 12vw, 176px)">
    <div style="background: #121211; color: #F3F1EC">
      <footer style="max-width: 1440px; margin: 0 auto; padding: 32px clamp(20px, 4vw, 56px) 40px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px; font-size: 13px; color: #A8A399">
        <a href="/en" aria-label="Y/RE Development — home"><img src="/assets/img/brand/mark-white.png" alt="Y/RE" style="height: 20px; width: auto; display: block"></a>
        <nav aria-label="Footer" style="display: flex; flex-wrap: wrap; gap: 28px">
          <a href="/en/projects" style="color: #D6D2CA">Projects</a>
          <a href="/en/services" style="color: #D6D2CA">Our services</a>
          <a href="/en/about" style="color: #D6D2CA">About</a>
          <a href="/en/contact" style="color: #D6D2CA">Contact</a>
          <a href="/en/privacy" style="color: #D6D2CA">Privacy</a>
        </nav>
        <span>© 2026 Y/RE Development · KvK 94645108</span>
      </footer>
    </div>
  </section>

</div>
</template>
<script type="module">
import { DCLogic, mount } from '/assets/dc.js';
import { FORM_ENDPOINT } from '/assets/config.js';

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      v: { first: '', last: '', email: '', org: '', type: '', msg: (() => { try { return (new URLSearchParams(location.search).get('vraag') || '').slice(0, 1200); } catch (e) { return ''; } })() },
      err: {},
      sent: false
    };
  }

  validate(v) {
    const err = {};
    if (!v.first.trim()) err.first = 'Please enter your first name.';
    if (!v.last.trim()) err.last = 'Please enter your last name.';
    if (!v.email.trim()) err.email = 'Please enter your email address.';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email.trim())) err.email = 'Please enter a valid email address.';
    if (!v.msg.trim()) err.msg = 'Please add a short message.';
    return err;
  }

  renderVals() {
    const v = this.state.v;
    const err = this.state.err || {};
    const set = (key, isCheck) => (e) => {
      const val = isCheck ? e.target.checked : e.target.value;
      const nv = { ...this.state.v, [key]: val };
      const ne = { ...this.state.err };
      if (ne[key]) delete ne[key];
      this.setState({ v: nv, err: ne });
    };
    const on = {
      first: set('first'), last: set('last'), email: set('email'), org: set('org'),
      type: set('type'), msg: set('msg')
    };
    const inv = {};
    ['first', 'last', 'email', 'msg'].forEach((k) => { inv[k] = err[k] ? 'true' : 'false'; });
    return {
      v: v,
      err: err,
      inv: inv,
      on: on,
      showForm: !this.state.sent,
      sent: this.state.sent,
      submit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const ne = this.validate(this.state.v);
        if (Object.keys(ne).length) {
          this.setState({ err: ne });
          const first = ['first', 'last', 'email', 'msg'].find((k) => ne[k]);
          const map = { first: 'f-first', last: 'f-last', email: 'f-email', msg: 'f-msg' };
          setTimeout(() => { const el = document.getElementById(map[first]); if (el) el.focus(); }, 0);
          return;
        }
        const v = this.state.v;
        const payload = { firstName: v.first, lastName: v.last, email: v.email, organisation: v.org, role: v.type, message: v.msg, _subject: 'Website request — ' + v.first + ' ' + v.last, _replyto: v.email };
        if (!FORM_ENDPOINT) {
          const body = 'Name: ' + v.first + ' ' + v.last + '\nEmail: ' + v.email + '\nOrganisation: ' + (v.org || '-') + '\nRole: ' + (v.type || '-') + '\n\n' + v.msg;
          window.location.href = 'mailto:info@yre-development.nl?subject=' + encodeURIComponent(payload._subject) + '&body=' + encodeURIComponent(body);
          this.setState({ sent: true, err: {} });
          return;
        }
        this.setState({ sending: true, err: {} });
        fetch(FORM_ENDPOINT, { method: 'POST', headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
          .then((r) => { if (!r.ok) throw new Error('send failed'); this.setState({ sent: true, sending: false, err: {} }); })
          .catch(() => this.setState({ sending: false, err: { form: 'Something went wrong. Please try again or email us at info@yre-development.nl.' } }));
      },
      reset: () => this.setState({
        v: { first: '', last: '', email: '', org: '', type: '', msg: '' },
        err: {}, sent: false
      })
    };
  }
}

mount(Component, {});
</script>
</body>
</html>
