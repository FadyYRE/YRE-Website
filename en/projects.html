<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">

<link rel="preload" href="/assets/fonts/archivo-var.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="/assets/fonts/instrument-sans-var.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face{font-family:'Archivo';src:url('/assets/fonts/archivo-var.woff') format('woff');font-weight:100 900;font-stretch:62% 125%;font-style:normal;font-display:swap}
@font-face{font-family:'Instrument Sans';src:url('/assets/fonts/instrument-sans-var.woff') format('woff');font-weight:400 700;font-stretch:75% 100%;font-style:normal;font-display:swap}
body{margin:0;background:#F3F1EC}
a{color:#121211;text-decoration:none}a:hover{color:#5F5B54}
@keyframes yreUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes yreLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes yreFade{from{opacity:0}to{opacity:1}}
.yre-up{animation:yreUp 1.1s cubic-bezier(.2,.7,.1,1) both}
.yre-d1{animation-delay:.15s}.yre-d2{animation-delay:.3s}
.yre-line{transform-origin:left center;animation:yreLine 1.3s cubic-bezier(.7,0,.2,1) .2s both}
.yre-fade{animation:yreFade 1.4s ease .5s both}
.yre-panel{transition:flex-grow 1s cubic-bezier(.7,0,.2,1),flex-basis 1s cubic-bezier(.7,0,.2,1)}
.yre-strip{all:unset;box-sizing:border-box;position:absolute;inset:0;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:28px 0 36px;transition:background .4s ease}
.yre-strip:hover{background:rgba(243,241,236,.07)}
.yre-strip:focus-visible{outline:2px solid #F3F1EC;outline-offset:-6px}
.yre-vert{writing-mode:vertical-rl;transform:rotate(180deg)}
@keyframes yreProg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.yre-prog{transform-origin:left center;animation:yreProg 7s linear both}
@keyframes yreSlide{0%{opacity:0;transform:scale(1.07)}4%{opacity:1}25%{opacity:1}29%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes yreSlide3{0%{opacity:0;transform:scale(1.07)}5%{opacity:1}33.3%{opacity:1}38.3%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes yreSlide5{0%{opacity:0;transform:scale(1.07)}3.5%{opacity:1}20%{opacity:1}23.5%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes yreSlide7{0%{opacity:0;transform:scale(1.07)}2.4%{opacity:1}14.3%{opacity:1}16.7%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes yreSlide6{0%{opacity:0;transform:scale(1.07)}2.7%{opacity:1}16.7%{opacity:1}19.4%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.yre-slide{opacity:0;animation-name:yreSlide;animation-timing-function:linear;animation-iteration-count:infinite;animation-fill-mode:both}
.yre-open-in{animation:yreUp .9s cubic-bezier(.2,.7,.1,1) .35s both}
@media (max-width: 760px){
.yre-acc{flex-direction:column;height:auto!important}
.yre-panel{flex:none!important;height:84px}
.yre-panel.yre-panel-open{height:520px}
.yre-strip{flex-direction:row;justify-content:flex-start;gap:20px;padding:0 20px}
.yre-vert{writing-mode:horizontal-tb;transform:none}
}
.yre-arrow{display:inline-block;transition:transform .5s cubic-bezier(.2,.7,.1,1)}
a:hover .yre-arrow{transform:translateX(6px)}
.yre-row{transition:background .4s ease}
a.yre-row:hover{background:#ECE9E2}
@media (prefers-reduced-motion: reduce){.yre-up,.yre-line,.yre-fade,.yre-open-in,.yre-prog,.yre-slide{animation:none}.yre-slide{opacity:0}.yre-panel,.yre-arrow{transition:none}}
@media (max-width: 600px){.yre-nav{gap:16px!important;font-size:13px!important;width:100%}.yre-nav>span:last-child{margin-left:auto}}
@media (max-width: 760px){.yre-phases{grid-template-columns:minmax(0,1fr)!important;row-gap:14px!important}.yre-phase{flex-direction:row!important;align-items:center!important;gap:14px!important}.yre-phase>span:first-child{margin-top:0!important;flex:none}.yre-phasetrack{display:none!important}}
@media (max-width: 760px){.yre-panel.yre-panel-open{height:100vw!important;max-height:600px}.yre-panel-open .yre-open-in{padding:20px 20px 22px!important;gap:0;justify-content:flex-end!important}.yre-panel-open .yre-open-in>div:first-child{display:none!important}.yre-panel-open .yre-open-in>div:last-child{gap:10px!important}.yre-panel-open .yre-open-in>div:last-child>div:first-child{gap:8px!important}.yre-panel-open .yre-open-in h3{font-size:clamp(30px,9vw,40px)!important}.yre-panel{height:64px}.yre-strip{padding:0 20px!important}}
.yre-panel-link{position:absolute;inset:0;z-index:2;cursor:pointer}
.yre-panel-link:focus-visible{outline:2px solid #F3F1EC;outline-offset:-6px}
@media (hover: hover){.yre-panel-open .yre-slide,.yre-panel-open .yre-cover{transition:filter .4s ease}.yre-panel-open:hover .yre-slide,.yre-panel-open:hover .yre-cover{filter:brightness(1.06)}}
.yre-panel:not(.yre-panel-open) img[src*="in-ontwikkeling"]{display:none!important}

.yre-slider:has(img[src*="in-ontwikkeling"]) .yre-shade,.yre-panel-open:has(img[src*="in-ontwikkeling"]) .yre-shade{display:none!important}
@media (max-width: 760px){img[src$="cartesius-in-ontwikkeling-nl.jpg"]{content:url(/assets/img/cartesius-in-ontwikkeling-nl-sq.jpg)}img[src$="cartesius-in-ontwikkeling-en.jpg"]{content:url(/assets/img/cartesius-in-ontwikkeling-en-sq.jpg)}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding: 40px 20px; font-family: system-ui, sans-serif">This website requires JavaScript. Contact us at <a href="mailto:info@yre-development.nl">info@yre-development.nl</a>.</p></noscript>
<template id="dc-template">
<div style="font-family: 'Instrument Sans', system-ui, sans-serif; color: #121211; background: #F3F1EC; -webkit-font-smoothing: antialiased">

  <!-- Header -->
  <header style="max-width: 1440px; margin: 0 auto; padding: 28px clamp(20px, 4vw, 56px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px">
    <a href="/en" aria-label="Y/RE Development — home" style="display: flex; align-items: center">
      <img src="/assets/img/brand/mark-black.png" alt="Y/RE" style="height: 22px; width: auto; display: block">
    </a>
    <nav class="yre-nav" aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: clamp(20px, 3vw, 44px); font-size: 14px; letter-spacing: 0.02em">
      <a href="/en/projects" aria-current="page" style="border-bottom: 1px solid #121211; padding-bottom: 2px">Projects</a>
      <a href="/en/services">Our services</a>
      <a href="/en/about">About</a>
      <a href="/en/contact">Contact</a>
      <span style="display: flex; gap: 8px; color: #5F5B54; font-size: 13px"><a href="/projecten" lang="nl" style="color: #5F5B54">NL</a><span aria-hidden="true">/</span><a href="#top" aria-current="true" style="color: #121211">EN</a></span>
    </nav>
  </header>

  <!-- Accordion -->
  <section id="top" aria-label="Selected projects" class="yre-fade" style="margin-top: clamp(8px, 1vw, 16px)">
    <div class="yre-acc" onMouseEnter="{{ pause }}" onMouseLeave="{{ resume }}" style="display: flex; gap: 2px; height: clamp(420px, min(82vh, 56vw), 860px); background: #F3F1EC">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="4">
        <div class="{{ item.cls }}" style="position: relative; overflow: hidden; min-width: 0; background: {{ item.bg }}; color: #F3F1EC; {{ item.flexStyle }}">

          <sc-if value="{{ item.hasImg }}" hint-placeholder-val="{{ false }}">
            <img class="yre-cover" src="{{ item.cover }}" alt="" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
          </sc-if>

          <sc-if value="{{ item.open }}" hint-placeholder-val="{{ true }}">
            <sc-for list="{{ item.slides }}" as="s" hint-placeholder-count="0">
              <img class="yre-slide" src="{{ s.src }}" alt="{{ s.alt }}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; animation-name: {{ s.anim }}; animation-duration: {{ s.dur }}; animation-delay: {{ s.delay }}; animation-play-state: {{ item.playState }}">
            </sc-for>
            <sc-if value="{{ item.hasImg }}" hint-placeholder-val="{{ false }}">
              <div class="yre-shade" aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(18,18,17,0.74) 0%, rgba(18,18,17,0) 52%), linear-gradient(to bottom, rgba(18,18,17,0.42) 0%, rgba(18,18,17,0) 24%)"></div>
            </sc-if>
            <div class="yre-open-in" style="position: absolute; inset: 0; padding: clamp(24px, 3vw, 44px); box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
              <div style="display: flex; align-items: center; gap: 28px; font-size: 13px; letter-spacing: 0.06em">
                <span style="display: inline-flex; align-items: center; gap: 8px; text-transform: uppercase; color: #D6D2CA">
                  <svg width="11" height="15" viewBox="0 0 12 16" aria-hidden="true" style="flex: none; color: #F3F1EC"><path fill="currentColor" fill-rule="evenodd" d="M6 0C2.69 0 0 2.62 0 5.86 0 10.1 6 16 6 16s6-5.9 6-10.14C12 2.62 9.31 0 6 0zm0 8.4a2.55 2.55 0 1 1 0-5.1 2.55 2.55 0 0 1 0 5.1z"></path></svg>
                  {{ item.place }}
                </span>
              </div>
              <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 28px">
                <div style="display: flex; flex-direction: column; gap: 18px; min-width: 0">
                  <h2 style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 500; font-stretch: 86%; font-size: clamp(36px, 4.4vw, 68px); line-height: 0.95; letter-spacing: -0.035em">{{ item.name }}</h2>
                  <span style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #D6D2CA">{{ item.meta }}</span>
                <sc-if value="{{ item.hasCredit }}" hint-placeholder-val="{{ false }}"><span style="margin-top: -6px; font-size: 12px; line-height: 1.5; letter-spacing: 0.01em; color: #D6D2CA; text-shadow: 0 1px 8px rgba(18,18,17,0.5)">{{ item.credit }}</span></sc-if>
                </div>
              </div>
            </div>
            <sc-if value="{{ item.hasPage }}" hint-placeholder-val="{{ true }}"><a class="yre-panel-link" href="{{ item.href }}" aria-label="View project: {{ item.name }}"></a></sc-if>
            <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; opacity: 0; pointer-events: none">
              <div class="yre-prog" onAnimationEnd="{{ item.next }}" style="height: 100%; background: #F3F1EC; animation-duration: {{ item.dur }}; animation-play-state: {{ item.playState }}"></div>
            </div>
          </sc-if>

          <sc-if value="{{ item.closed }}" hint-placeholder-val="{{ false }}">
            <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(18,18,17,0.5)"></div>
            <button type="button" class="yre-strip" onClick="{{ item.pick }}" aria-label="{{ item.label }}">
              <span class="yre-vert" style="font-family: 'Archivo', sans-serif; font-weight: 500; font-stretch: 90%; font-size: clamp(18px, 1.6vw, 24px); letter-spacing: -0.01em; white-space: nowrap">{{ item.stripName }}</span>
            </button>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </section>

  <!-- Intro -->
  <section style="max-width: 1440px; margin: 0 auto; padding: clamp(56px, 6vw, 88px) clamp(20px, 4vw, 56px) 0; box-sizing: border-box">
    <div class="yre-line" style="height: 1px; background: #121211; margin: 28px 0 clamp(36px, 4vw, 56px)"></div>
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 32px">
      <h1 class="yre-up yre-d1" style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 500; font-stretch: 88%; font-size: clamp(46px, 7vw, 108px); line-height: 0.98; letter-spacing: -0.035em; max-width: 980px">From vision to development.</h1>
      <p class="yre-up yre-d2" style="margin: 0; max-width: 420px; font-size: 18px; line-height: 1.55">From complex development challenges to distinctive architecture. Projects that have shaped our experience and perspective on real estate development.</p>
    </div>
  </section>

  <!-- Contact band + footer -->
  <section style="margin-top: clamp(112px, 12vw, 176px); background: #121211; color: #F3F1EC">
    <div style="max-width: 1440px; margin: 0 auto; padding: clamp(72px, 8vw, 120px) clamp(20px, 4vw, 56px) clamp(48px, 5vw, 72px); box-sizing: border-box">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 40px">
        <h2 style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 500; font-stretch: 88%; font-size: clamp(40px, 5.4vw, 84px); line-height: 0.98; letter-spacing: -0.035em; max-width: 880px">Have a project, site or idea? Let’s look at it together.</h2>
        <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px">
          <a href="/en/contact" style="color: #F3F1EC; display: inline-flex; align-items: center; gap: 14px; min-height: 44px; font-size: 15px; font-weight: 500; border-bottom: 1px solid #F3F1EC; padding-bottom: 4px">Get in touch</a>
          <a href="mailto:info@yre-development.nl" style="color: #D6D2CA; display: inline-flex; align-items: center; min-height: 44px; font-size: 15px">info@yre-development.nl</a>
        </div>
      </div>
      <footer style="margin-top: clamp(72px, 8vw, 120px); padding-top: 28px; border-top: 1px solid #3A3935; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px; font-size: 13px; color: #A8A399">
        <a href="/en" aria-label="Y/RE Development — home"><img src="/assets/img/brand/mark-white.png" alt="Y/RE" style="height: 20px; width: auto; display: block"></a>
        <nav aria-label="Footer" style="display: flex; flex-wrap: wrap; gap: 28px">
          <a href="/en/projects" style="color: #D6D2CA">Projects</a>
          <a href="/en/services" style="color: #D6D2CA">Our services</a>
          <a href="/en/about" style="color: #D6D2CA">About</a>
          <a href="/en/contact" style="color: #D6D2CA">Contact</a>
          <a href="/en/privacy" style="color: #D6D2CA">Privacy</a>
        </nav>
        <span>© 2026 Y/RE Development · KvK 94645108</span>
      </footer>
    </div>
  </section>

</div>
</template>
<script type="module">
import { DCLogic, mount } from '/assets/dc.js';

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: 0, paused: false };
    this.projects = [
      { n: '01', href: '/en/projects/koolkiel', name: 'KoolKiel', credit: 'Design: MVRDV · Image: © MVRDV', place: 'Kiel, DE', meta: 'Kiel — Under construction', title: 'KoolKiel', location: 'Kiel, Germany', phase: 'Under construction', role: 'Delegated Development', bg: '#33312D',
        images: [
          { src: '/assets/img/koolkiel/kk-1.jpg', alt: 'KoolKiel tower of stacked, lit volumes at dusk seen from a park' },
          { src: '/assets/img/koolkiel/kk-2.jpg', alt: 'Aerial view of KoolKiel with two towers and a long block topped by colourful roofs beside a tram line' },
          { src: '/assets/img/koolkiel/kk-3.jpg', alt: 'Street view of the KoolKiel towers with a tram stop in the foreground' }
        ] },
      { n: '02', href: '/en/projects/ikaria', name: 'Ikaria', strip: 'Cartesius · Ikaria', place: 'Utrecht, NL — Cartesius', meta: 'Cartesius Utrecht — Pre-construction', title: 'Cartesius — Ikaria', location: 'Utrecht', phase: 'Pre-construction', role: 'Delegated Development', bg: '#151515', page: true,
        images: [
          { src: '/assets/img/cartesius-in-ontwikkeling-en.jpg', alt: 'Ikaria — in development' }
        ] },
      { n: '03', href: '/en/projects/sub-area-7', name: 'Sub-area 7', strip: 'Cartesius · Sub-area 7', place: 'Utrecht, NL — Cartesius', meta: 'Cartesius Utrecht — In development', title: 'Cartesius — Sub-area 7', location: 'Utrecht', phase: 'In development', role: 'Delegated Development', bg: '#151515',
        images: [
          { src: '/assets/img/cartesius-in-ontwikkeling-en.jpg', alt: 'Sub-area 7 — in development' }
        ] },
      { n: '04', href: '/en/projects/sub-area-8', name: 'Sub-area 8', strip: 'Cartesius · Sub-area 8', place: 'Utrecht, NL — Cartesius', meta: 'Cartesius Utrecht — In development', title: 'Cartesius — Sub-area 8', location: 'Utrecht', phase: 'In development', role: 'Delegated Development', bg: '#151515',
        images: [
          { src: '/assets/img/cartesius-in-ontwikkeling-en.jpg', alt: 'Sub-area 8 — in development' }
        ] }
    ];
  }
  renderVals() {
    const a = this.state.active || 0;
    const count = this.projects.length;
    const playState = this.state.paused ? 'paused' : 'running';
    const next = () => this.setState((s) => ({ active: ((s.active || 0) + 1) % count }));
    const SLIDE = 4;
    const items = this.projects.map((p, i) => ({
      ...p,
      stripName: p.strip || p.name,
      hasPage: !!p.href,
      hasCredit: !!p.credit,
      hasImg: !!(p.images && p.images.length),
      noImg: !(p.images && p.images.length),
      cover: p.images && p.images.length ? p.images[0].src : '',
      dur: p.images && p.images.length > 1 ? (p.images.length * SLIDE) + 's' : '7s',
      slides: (p.images || []).length > 1 ? p.images.map((img, k) => ({
        src: img.src,
        alt: img.alt,
        dur: (p.images.length * SLIDE) + 's',
        anim: p.images.length === 4 ? 'yreSlide' : 'yreSlide' + p.images.length,
        delay: (k * SLIDE) + 's'
      })) : [],
      open: i === a,
      closed: i !== a,
      cls: i === a ? 'yre-panel yre-panel-open' : 'yre-panel',
      flexStyle: i === a ? 'flex-grow: 1; flex-basis: 0px' : 'flex-grow: 0; flex-basis: clamp(64px, 8vw, 128px)',
      label: 'Show project ' + p.n,
      pick: () => this.setState({ active: i }),
      next: next,
      playState: playState
    }));
    const rows = this.projects.map((p) => ({
      n: p.n, title: p.title, location: p.location, phase: p.phase, role: p.role,
      hasPage: !!p.page, noPage: !p.page
    }));
    return {
      items: items,
      rows: rows,
      pause: () => this.setState({ paused: true }),
      resume: () => this.setState({ paused: false })
    };
  }
}

mount(Component, {});
</script>
</body>
</html>
