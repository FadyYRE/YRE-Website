<style>
@font-face{font-family:'Archivo';src:url('/assets/fonts/archivo-var.woff') format('woff');font-weight:100 900;font-stretch:62% 125%;font-style:normal;font-display:swap}
@font-face{font-family:'Instrument Sans';src:url('/assets/fonts/instrument-sans-var.woff') format('woff');font-weight:400 700;font-stretch:75% 100%;font-style:normal;font-display:swap}
body{margin:0;background:#F3F1EC}
a{color:#121211;text-decoration:none}a:hover{color:#5F5B54}
@keyframes yreUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes yreFade{from{opacity:0}to{opacity:1}}
.yre-up{animation:yreUp 1.1s cubic-bezier(.2,.7,.1,1) both}
.yre-d0{animation-delay:2.2s}.yre-d1{animation-delay:2.55s}.yre-d2{animation-delay:2.8s}.yre-d3{animation-delay:3.05s}
.yre-fade{animation:yreFade 1.6s ease both;animation-delay:2.95s}
@keyframes yreDraw{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes yreRise{from{transform:translateY(102%)}to{transform:none}}
@keyframes yreWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes yreTrack{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@keyframes yreLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.yre-logo{cursor:pointer;background:none;border:0;padding:0;margin:0;display:block}
.yre-logo img{display:block;width:100%;height:auto}
.yre-mask{position:absolute;overflow:hidden}

.yre-a-yl{animation:yreRise .8s cubic-bezier(.7,0,.2,1) .1s both}
.yre-a-yr{animation:yreRise .8s cubic-bezier(.7,0,.2,1) .18s both}
.yre-a-slash{animation:yreDraw .75s cubic-bezier(.7,0,.2,1) .65s both}
.yre-a-r{animation:yreWipe .85s cubic-bezier(.7,0,.2,1) 1.15s both}
.yre-a-e1{animation:yreWipe .6s cubic-bezier(.7,0,.2,1) 1.25s both}
.yre-a-e2{animation:yreWipe .6s cubic-bezier(.7,0,.2,1) 1.35s both}
.yre-a-e3{animation:yreWipe .6s cubic-bezier(.7,0,.2,1) 1.45s both}
.yre-a-dev{animation:yreTrack 1.1s cubic-bezier(.6,0,.2,1) 1.8s both}
.yre-a-tag{animation:yreUp .9s cubic-bezier(.2,.7,.1,1) 2.25s both}
.yre-panel{transition:flex-grow 1s cubic-bezier(.7,0,.2,1),flex-basis 1s cubic-bezier(.7,0,.2,1)}
.yre-strip{all:unset;box-sizing:border-box;position:absolute;inset:0;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:28px 0 36px;transition:background .4s ease}
.yre-strip:hover{background:rgba(243,241,236,.07)}
.yre-strip:focus-visible{outline:2px solid #F3F1EC;outline-offset:-6px}
.yre-vert{writing-mode:vertical-rl;transform:rotate(180deg)}
@keyframes yreProg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.yre-prog{transform-origin:left center;animation:yreProg 7s linear both}
@keyframes yreSlide{0%{opacity:0;transform:scale(1.07)}4%{opacity:1}25%{opacity:1}29%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes yreSlide3{0%{opacity:0;transform:scale(1.07)}5%{opacity:1}33.3%{opacity:1}38.3%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes yreSlide5{0%{opacity:0;transform:scale(1.07)}3.5%{opacity:1}20%{opacity:1}23.5%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes yreSlide7{0%{opacity:0;transform:scale(1.07)}2.4%{opacity:1}14.3%{opacity:1}16.7%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes yreSlide6{0%{opacity:0;transform:scale(1.07)}2.7%{opacity:1}16.7%{opacity:1}19.4%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.yre-slide{opacity:0;animation-name:yreSlide;animation-timing-function:linear;animation-iteration-count:infinite;animation-fill-mode:both}
.yre-open-in{animation:yreUp .9s cubic-bezier(.2,.7,.1,1) .35s both}
@media (max-width: 860px){.yre-principles{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media (max-width: 520px){.yre-principles{grid-template-columns:minmax(0,1fr)!important}}
@media (max-width: 760px){
.yre-acc{flex-direction:column;height:auto!important}
.yre-panel{flex:none!important;height:84px}
.yre-panel.yre-panel-open{height:520px}
.yre-strip{flex-direction:row;justify-content:flex-start;gap:20px;padding:0 20px}
.yre-vert{writing-mode:horizontal-tb;transform:none}
}
.yre-line{transform-origin:left center;animation:yreLine 1.3s cubic-bezier(.7,0,.2,1) 2.35s both}
.yre-img{overflow:hidden}
.yre-fill{transition:transform 1.4s cubic-bezier(.2,.7,.1,1)}
.yre-img:hover .yre-fill{transform:scale(1.025)}
.yre-arrow{display:inline-block;transition:transform .5s cubic-bezier(.2,.7,.1,1)}
a:hover .yre-arrow{transform:translateX(6px)}
.yre-row{transition:background .4s ease}
.yre-row:hover{background:#ECE9E2}
@media (prefers-reduced-motion: reduce){.yre-up,.yre-fade,.yre-line,.yre-a-slash,.yre-a-yl,.yre-a-yr,.yre-a-r,.yre-a-e1,.yre-a-e2,.yre-a-e3,.yre-a-dev,.yre-a-tag,.yre-open-in,.yre-prog,.yre-slide{animation:none}@media (max-width: 600px){.yre-nav{gap:16px!important;font-size:13px!important;width:100%}.yre-nav>span:last-child{margin-left:auto}}}
@media (max-width: 760px){.yre-phases{grid-template-columns:minmax(0,1fr)!important;row-gap:14px!important}.yre-phase{flex-direction:row!important;align-items:center!important;gap:14px!important}.yre-phase>span:first-child{margin-top:0!important;flex:none}.yre-phasetrack{display:none!important}}
@keyframes yreMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.yre-marquee{overflow:hidden;max-width:100%;min-width:0;contain:paint;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.yre-marquee-track{display:flex;width:max-content;animation:yreMarquee 60s linear infinite}
.yre-marquee:hover .yre-marquee-track{animation-play-state:paused}
.yre-marquee-track>span{display:flex;align-items:center;white-space:nowrap}
.yre-marquee-track i{font-style:normal;color:#A8A399;margin:0 clamp(18px,2.2vw,32px)}
@media (prefers-reduced-motion: reduce){.yre-marquee{-webkit-mask-image:none;mask-image:none}.yre-marquee-track{animation:none;width:auto;flex-wrap:wrap}.yre-marquee-track>span{white-space:normal;flex-wrap:wrap;row-gap:8px}.yre-marquee-track>span[aria-hidden]{display:none}}
@media (max-width: 760px){.yre-panel.yre-panel-open{height:100vw!important;max-height:600px}.yre-panel-open .yre-open-in{padding:20px 20px 22px!important;gap:0;justify-content:flex-end!important}.yre-panel-open .yre-open-in>div:first-child{display:none!important}.yre-panel-open .yre-open-in>div:last-child{gap:10px!important}.yre-panel-open .yre-open-in>div:last-child>div:first-child{gap:8px!important}.yre-panel-open .yre-open-in h3{font-size:clamp(30px,9vw,40px)!important}.yre-panel{height:64px}.yre-strip{padding:0 20px!important}}
.yre-panel-link{position:absolute;inset:0;z-index:2;cursor:pointer}
.yre-panel-link:focus-visible{outline:2px solid #F3F1EC;outline-offset:-6px}
@media (hover: hover){.yre-panel-open .yre-slide,.yre-panel-open .yre-cover{transition:filter .4s ease}.yre-panel-open:hover .yre-slide,.yre-panel-open:hover .yre-cover{filter:brightness(1.06)}}
.yre-panel:not(.yre-panel-open) img[src*="in-ontwikkeling"]{display:none!important}

.yre-slider:has(img[src*="in-ontwikkeling"]) .yre-shade,.yre-panel-open:has(img[src*="in-ontwikkeling"]) .yre-shade{display:none!important}
@media (max-width: 760px){img[src$="cartesius-in-ontwikkeling-nl.jpg"]{content:url(/assets/img/cartesius-in-ontwikkeling-nl-sq.jpg)}img[src$="cartesius-in-ontwikkeling-en.jpg"]{content:url(/assets/img/cartesius-in-ontwikkeling-en-sq.jpg)}}
</style>

<body>

<noscript><p style="padding: 40px 20px; font-family: system-ui, sans-serif">Deze website gebruikt JavaScript. Neem contact op via <a href="mailto:info@yre-development.nl">info@yre-development.nl</a>.</p></noscript>
<template id="dc-template">
<div style="font-family: 'Instrument Sans', system-ui, sans-serif; color: #121211; background: #F3F1EC; -webkit-font-smoothing: antialiased">

  <!-- Header -->
  <header style="max-width: 1440px; margin: 0 auto; padding: 28px clamp(20px, 4vw, 56px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px">
    <a href="#top" aria-label="Y/RE Development — startpagina" style="display: flex; align-items: center">
      <img src="/assets/img/brand/mark-black.png" alt="Y/RE" style="height: 22px; width: auto; display: block">
    </a>
    <nav class="yre-nav" aria-label="Hoofdmenu" style="display: flex; flex-wrap: wrap; align-items: center; gap: clamp(20px, 3vw, 44px); font-size: 14px; letter-spacing: 0.02em">
      <a href="/projecten">Projecten</a>
      <a href="/diensten">Onze diensten</a>
      <a href="/over-ons">Over ons</a>
      <a href="/contact">Contact</a>
      <span style="display: flex; gap: 8px; color: #5F5B54; font-size: 13px"><a href="#top" aria-current="true" style="color: #121211">NL</a><span aria-hidden="true">/</span><a href="/en" lang="en" style="color: #5F5B54">EN</a></span>
    </nav>
  </header>

  <!-- Hero -->
  <section id="top" style="max-width: 1440px; margin: 0 auto; padding: clamp(56px, 9vw, 128px) clamp(20px, 4vw, 56px) 0; box-sizing: border-box">
    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 32px">
      <button type="button" class="yre-logo" onClick="{{ replay }}" aria-label="Y/RE Development — Yassa Real Estate Development (logo-animatie opnieuw afspelen)" title="Opnieuw afspelen" style="position: relative; width: min(560px, 100%); aspect-ratio: 964 / 467">
        <sc-if value="{{ play }}" hint-placeholder-val="{{ true }}">
          <span class="yre-mask" aria-hidden="true" style="left: 0%; top: 0%; width: 16.079%"><img class="yre-a-yl" src="/assets/img/logo/y-left.png" alt=""></span>
          <span class="yre-mask" aria-hidden="true" style="left: 12.656%; top: 0%; width: 22.199%"><img class="yre-a-yr" src="/assets/img/logo/y-right.png" alt=""></span>
          <span class="yre-mask" aria-hidden="true" style="left: 23.548%; top: 0%; width: 22.614%"><img class="yre-a-slash" src="/assets/img/logo/slash.png" alt=""></span>
          <span class="yre-mask" aria-hidden="true" style="left: 44.502%; top: 0%; width: 24.793%"><img class="yre-a-r" src="/assets/img/logo/r.png" alt=""></span>
          <span class="yre-mask" aria-hidden="true" style="left: 72.095%; top: 52.248%; width: 27.282%"><img class="yre-a-e1" src="/assets/img/logo/e-bot.png" alt=""></span>
          <span class="yre-mask" aria-hidden="true" style="left: 72.199%; top: 26.338%; width: 22.407%"><img class="yre-a-e2" src="/assets/img/logo/e-mid.png" alt=""></span>
          <span class="yre-mask" aria-hidden="true" style="left: 72.095%; top: 0%; width: 27.282%"><img class="yre-a-e3" src="/assets/img/logo/e-top.png" alt=""></span>
          <span class="yre-mask" aria-hidden="true" style="left: 1.867%; top: 74.518%; width: 98.133%"><img class="yre-a-dev" src="/assets/img/logo/development.png" alt=""></span>
          <span class="yre-mask" aria-hidden="true" style="left: 1.763%; top: 94.861%; width: 96.784%; overflow: visible"><img class="yre-a-tag" src="/assets/img/logo/tagline.png" alt=""></span>
        </sc-if>
      </button>
      <div class="yre-up yre-d0" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #5F5B54; text-align: left">
        <span>Begrijpen. Verbinden. Ontwikkelen.</span>
      </div>
    </div>

    <div style="height: 1px; background: #121211; margin: clamp(48px, 7vw, 96px) 0 clamp(40px, 5vw, 64px)" class="yre-line"></div>

    <h1 class="yre-up yre-d1" style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 500; font-stretch: 88%; font-size: clamp(46px, 7.6vw, 116px); line-height: 0.98; letter-spacing: -0.035em; max-width: 1180px">Vastgoed ontwikkelen begint met begrijpen.</h1>

    <div class="yre-up yre-d2" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 32px; margin-top: clamp(40px, 5vw, 72px)">
      <p style="margin: 0; max-width: 600px; font-size: clamp(18px, 1.5vw, 21px); line-height: 1.5; color: #121211">Begrijpen wat een plek bijzonder maakt, wat mensen nodig hebben en hoe een ontwikkeling kan bijdragen aan haar omgeving. Wij vertalen deze inzichten naar doordachte ontwikkelplannen waarin ruimtelijke kwaliteit, gebruikswaarde en economische haalbaarheid samenkomen. Zo creëren we blijvende waarde voor mens en omgeving.</p>    </div>
  </section>

  <!-- Selected projects — accordion -->
  <section id="projects" class="yre-fade" style="margin-top: clamp(72px, 9vw, 128px)">
    <div style="max-width: 1440px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 56px) 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 24px">
      <div style="display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap">
        <span style="font-family: 'Archivo', sans-serif; font-weight: 500; font-stretch: 90%; font-size: clamp(20px, 1.8vw, 26px); letter-spacing: -0.01em">Van visie naar ontwikkeling.</span>
      </div>
      <a href="/projecten" style="display: inline-flex; align-items: center; gap: 14px; min-height: 44px; font-size: 15px; font-weight: 500; border-bottom: 1px solid #121211; padding-bottom: 4px">Alle projecten</a>
    </div>

    <div class="yre-acc" onMouseEnter="{{ pause }}" onMouseLeave="{{ resume }}" style="display: flex; gap: 2px; height: clamp(420px, min(82vh, 56vw), 860px); background: #F3F1EC">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="4">
        <div class="{{ item.cls }}" style="position: relative; overflow: hidden; min-width: 0; background: {{ item.bg }}; color: #F3F1EC; {{ item.flexStyle }}">

          <sc-if value="{{ item.hasImg }}" hint-placeholder-val="{{ false }}">
            <img class="yre-cover" src="{{ item.cover }}" alt="" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
          </sc-if>

          <sc-if value="{{ item.open }}" hint-placeholder-val="{{ true }}">
            <sc-for list="{{ item.slides }}" as="s" hint-placeholder-count="0">
              <img class="yre-slide" src="{{ s.src }}" alt="{{ s.alt }}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; animation-name: {{ s.anim }}; animation-duration: {{ s.dur }}; animation-delay: {{ s.delay }}; animation-play-state: {{ item.playState }}">
            </sc-for>
            <sc-if value="{{ item.hasImg }}" hint-placeholder-val="{{ false }}">
              <div class="yre-shade" aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(18,18,17,0.74) 0%, rgba(18,18,17,0) 52%), linear-gradient(to bottom, rgba(18,18,17,0.42) 0%, rgba(18,18,17,0) 24%)"></div>
            </sc-if>
            <div class="yre-open-in" style="position: absolute; inset: 0; padding: clamp(24px, 3vw, 44px); box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
              <div style="display: flex; align-items: center; gap: 28px; font-size: 13px; letter-spacing: 0.06em">
                <span style="display: inline-flex; align-items: center; gap: 8px; text-transform: uppercase; color: #D6D2CA">
                  <svg width="11" height="15" viewBox="0 0 12 16" aria-hidden="true" style="flex: none; color: #F3F1EC"><path fill="currentColor" fill-rule="evenodd" d="M6 0C2.69 0 0 2.62 0 5.86 0 10.1 6 16 6 16s6-5.9 6-10.14C12 2.62 9.31 0 6 0zm0 8.4a2.55 2.55 0 1 1 0-5.1 2.55 2.55 0 0 1 0 5.1z"></path></svg>
                  {{ item.place }}
                </span>
              </div>
              <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 28px">
                <div style="display: flex; flex-direction: column; gap: 18px; min-width: 0">
                  <h3 style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 500; font-stretch: 86%; font-size: clamp(36px, 4.4vw, 68px); line-height: 0.95; letter-spacing: -0.035em">{{ item.name }}</h3>
                  <span style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #D6D2CA">{{ item.meta }}</span>
                <sc-if value="{{ item.hasCredit }}" hint-placeholder-val="{{ false }}"><span style="margin-top: -6px; font-size: 12px; line-height: 1.5; letter-spacing: 0.01em; color: #D6D2CA; text-shadow: 0 1px 8px rgba(18,18,17,0.5)">{{ item.credit }}</span></sc-if>
                </div>
              </div>
            </div>
            <sc-if value="{{ item.hasPage }}" hint-placeholder-val="{{ true }}"><a class="yre-panel-link" href="{{ item.href }}" aria-label="Bekijk project: {{ item.name }}"></a></sc-if>
            <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; opacity: 0; pointer-events: none">
              <div class="yre-prog" onAnimationEnd="{{ item.next }}" style="height: 100%; background: #F3F1EC; animation-duration: {{ item.dur }}; animation-play-state: {{ item.playState }}"></div>
            </div>
          </sc-if>

          <sc-if value="{{ item.closed }}" hint-placeholder-val="{{ false }}">
            <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(18,18,17,0.5)"></div>
            <button type="button" class="yre-strip" onClick="{{ item.pick }}" aria-label="{{ item.label }}">
              <span class="yre-vert" style="font-family: 'Archivo', sans-serif; font-weight: 500; font-stretch: 90%; font-size: clamp(18px, 1.6vw, 24px); letter-spacing: -0.01em; white-space: nowrap">{{ item.stripName }}</span>

          </sc-if>
        </div>
      </sc-for>
    </div>
  </section>

  <!-- Approach -->
  <section id="development" style="max-width: 1440px; margin: 0 auto; padding: clamp(112px, 14vw, 200px) clamp(20px, 4vw, 56px) 0; box-sizing: border-box">
    <div style="display: flex; flex-wrap: wrap; gap: clamp(32px, 5vw, 80px)">
      <div style="flex: 9 1 560px; min-width: 0">
        <h2 style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 500; font-stretch: 90%; font-size: clamp(30px, 3.6vw, 54px); line-height: 1.08; letter-spacing: -0.025em; max-width: 960px">Ruimtelijke kansen herkennen. Ontwikkelpotentie benutten.</h2>
        <p style="margin: 24px 0 0; font-size: clamp(18px, 1.5vw, 21px); line-height: 1.5; max-width: 640px">Wij verbinden locatie, programma, markt en haalbaarheid om kansen vroegtijdig te vertalen naar onderbouwde ontwikkelkeuzes.</p>
      </div>
    </div>

    <div class="yre-principles" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: clamp(20px, 2.5vw, 40px); row-gap: 40px; margin-top: clamp(64px, 7vw, 112px); border-top: 1px solid #121211">

<script type="module">
import { DCLogic, mount } from '/assets/dc.js';

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { play: true, active: 0, paused: false };
    this.projects = [
      { n: '01', href: '/projecten/koolkiel', name: 'KoolKiel', credit: 'Ontwerp: MVRDV · Beeld: © MVRDV', place: 'Kiel, DE', meta: 'Kiel — In aanbouw', role: 'Gedelegeerd ontwikkelaarschap', bg: '#33312D',
        images: [
          { src: '/assets/img/koolkiel/kk-1.jpg', alt: 'KoolKiel-toren van gestapelde, verlichte volumes bij schemering, gezien vanuit een park' },
          { src: '/assets/img/koolkiel/kk-2.jpg', alt: 'Luchtfoto van KoolKiel met twee torens en een lang blok met kleurrijke daken langs een tramlijn' },
          { src: '/assets/img/koolkiel/kk-3.jpg', alt: 'Straatbeeld van de KoolKiel-torens met een tramhalte op de voorgrond' }
        ] },
      { n: '02', href: '/projecten/ikaria', name: 'Ikaria', strip: 'Cartesius · Ikaria', place: 'Utrecht, NL — Cartesius', meta: 'Cartesius Utrecht — Bouwvoorbereiding', role: 'Gedelegeerd ontwikkelaarschap', bg: '#151515',
        images: [
          { src: '/assets/img/cartesius-in-ontwikkeling-nl.jpg', alt: 'Ikaria — in ontwikkeling' }
        ] },
      { n: '03', href: '/projecten/deelgebied-7', name: 'Deelgebied 7', strip: 'Cartesius · Deelgebied 7', place: 'Utrecht, NL — Cartesius', meta: 'Cartesius Utrecht — In ontwikkeling', role: 'Gedelegeerd ontwikkelaarschap', bg: '#151515',
        images: [
          { src: '/assets/img/cartesius-in-ontwikkeling-nl.jpg', alt: 'Deelgebied 7 — in ontwikkeling' }
        ] },
      { n: '04', href: '/projecten/deelgebied-8', name: 'Deelgebied 8', strip: 'Cartesius · Deelgebied 8', place: 'Utrecht, NL — Cartesius', meta: 'Cartesius Utrecht — In ontwikkeling', role: 'Gedelegeerd ontwikkelaarschap', bg: '#151515',
        images: [
          { src: '/assets/img/cartesius-in-ontwikkeling-nl.jpg', alt: 'Deelgebied 8 — in ontwikkeling' }
        ] }
    ];
  }
  componentWillUnmount() {
    clearTimeout(this._t);
  }
  renderVals() {
    const a = this.state.active || 0;
    const count = this.projects.length;
    const playState = this.state.paused ? 'paused' : 'running';
    const next = () => this.setState((s) => ({ active: ((s.active || 0) + 1) % count }));
    const SLIDE = 4;
    const items = this.projects.map((p, i) => ({
      ...p,
      stripName: p.strip || p.name,
      hasPage: !!p.href,
      hasCredit: !!p.credit,
      hasImg: !!(p.images && p.images.length),
      noImg: !(p.images && p.images.length),
      cover: p.images && p.images.length ? p.images[0].src : '',
      dur: p.images && p.images.length > 1 ? (p.images.length * SLIDE) + 's' : '7s',
      slides: (p.images || []).length > 1 ? p.images.map((img, k) => ({
        src: img.src,
        alt: img.alt,
        dur: (p.images.length * SLIDE) + 's',
        anim: p.images.length === 4 ? 'yreSlide' : 'yreSlide' + p.images.length,
        delay: (k * SLIDE) + 's'
      })) : [],
      open: i === a,
      closed: i !== a,
      cls: i === a ? 'yre-panel yre-panel-open' : 'yre-panel',
      flexStyle: i === a ? 'flex-grow: 1; flex-basis: 0px' : 'flex-grow: 0; flex-basis: clamp(64px, 8vw, 128px)',
      label: 'Toon project ' + p.n,
      pick: () => this.setState({ active: i }),
      next: next,
      playState: playState
    }));
    return {
      items: items,
      pause: () => this.setState({ paused: true }),
      resume: () => this.setState({ paused: false }),
      play: this.state.play,
      replay: () => {
        clearTimeout(this._t);
        this.setState({ play: false });
        this._t = setTimeout(() => this.setState({ play: true }), 40);
      }
    };
  }
}

mount(Component, {});
</script>
