<style>

body{margin:0;background:#F3F1EC}
a{color:#121211;text-decoration:none}a:hover{color:#5F5B54}
@keyframes yreUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes yreReveal{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes yreSeg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.yre-up{animation:yreUp 1.1s cubic-bezier(.2,.7,.1,1) both}
.yre-d1{animation-delay:.55s}.yre-d2{animation-delay:.7s}.yre-d3{animation-delay:.85s}
.yre-reveal{animation:yreReveal 1.3s cubic-bezier(.7,0,.2,1) both}
.yre-seg{transform-origin:left center;animation:yreSeg 6s linear both}
.yre-arrow{display:inline-block;transition:transform .5s cubic-bezier(.2,.7,.1,1)}
a:hover .yre-arrow{transform:translateX(6px)}
.yre-arrow-back{display:inline-block;transition:transform .5s cubic-bezier(.2,.7,.1,1)}
a:hover .yre-arrow-back{transform:translateX(-6px)}
.yre-ctl{all:unset;box-sizing:border-box;cursor:pointer;width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(243,241,236,.5);color:#F3F1EC;transition:background .3s ease}
.yre-ctl:hover{background:rgba(243,241,236,.14)}
.yre-ctl:focus-visible{outline:2px solid #F3F1EC;outline-offset:2px}
.yre-slider{cursor:grab}.yre-slider:active{cursor:grabbing}
.yre-phasefill{transition:width 1.8s cubic-bezier(.7,0,.2,1)}
@media (max-width: 960px){.yre-facts{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media (max-width: 520px){.yre-facts{grid-template-columns:minmax(0,1fr)!important}}
@media (prefers-reduced-motion: reduce){.yre-up,.yre-reveal,.yre-seg{animation:none}.yre-arrow,.yre-phasefill{transition:none}}
@media (max-width: 600px){.yre-nav{gap:16px!important;font-size:13px!important;width:100%}.yre-nav>span:last-child{margin-left:auto}}
@media (max-width: 760px){.yre-phases{grid-template-columns:minmax(0,1fr)!important;row-gap:14px!important}.yre-phase{flex-direction:row!important;align-items:center!important;gap:14px!important}.yre-phase>span:first-child{margin-top:0!important;flex:none}.yre-phasetrack{display:none!important}}
.yre-next{position:relative;overflow:hidden}
.yre-next>a{position:static!important;min-height:clamp(380px,34vw,520px)}
.yre-next>a>div:first-child{position:relative;z-index:1}
.yre-next-img{position:absolute;top:0;right:0;bottom:0;width:62%;overflow:hidden}
.yre-next-img img{display:block;width:100%;height:100%;object-fit:cover;transition:transform 1.6s cubic-bezier(.2,.7,.1,1)}
.yre-next-img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#121211 0%,rgba(18,18,17,.82) 22%,rgba(18,18,17,.25) 60%,rgba(18,18,17,.1) 100%),linear-gradient(0deg,rgba(18,18,17,.35),rgba(18,18,17,0) 40%)}
.yre-next:hover .yre-next-img img{transform:scale(1.03)}
@media (max-width: 760px){.yre-next>a{min-height:0;padding-top:calc(52vw + 8px)!important}.yre-next-img{left:0;bottom:auto;width:auto;height:62vw}.yre-next-img::after{background:linear-gradient(180deg,rgba(18,18,17,.05) 0%,rgba(18,18,17,.2) 45%,#121211 100%)}}
@media (prefers-reduced-motion: reduce){.yre-next-img img{transition:none}}
@media (max-width: 760px){.yre-slider{height:min(100vw,600px)!important}.yre-track img{object-fit:cover!important}.yre-hero-ui{padding:18px 20px 20px!important;gap:0;justify-content:flex-end!important}.yre-hero-ui>div:first-child{display:none!important}.yre-hero-ui>div:last-child{flex-wrap:nowrap!important;align-items:flex-end!important;gap:16px!important}.yre-hero-ui>div:last-child>div:first-child{gap:8px!important}.yre-hero-ui h1{font-size:clamp(30px,9vw,40px)!important}.yre-hero-ui a{margin-top:6px!important;min-height:36px!important;font-size:12px!important}.yre-hero-ui>div:last-child>div:last-child>div:first-child{gap:10px!important}.yre-hero-ui .yre-ctl{width:42px;height:42px}}
.yre-slider:not(:has(.yre-track img)){height:auto!important;min-height:0!important}.yre-slider:not(:has(.yre-track img)) .yre-hero-ui{position:relative!important;inset:auto!important;padding-top:clamp(40px,6vw,96px)!important;gap:clamp(24px,3vw,44px)!important}.yre-slider:not(:has(.yre-track img)) .yre-ctl,.yre-slider:not(:has(.yre-track img)) .yre-shade,.yre-slider:not(:has(.yre-track img)) .yre-track{display:none!important}.yre-credit:empty{display:none}.yre-next:not(:has(img))>a{min-height:0!important}@media (max-width: 760px){.yre-next:not(:has(img))>a{padding-top:48px!important}}
.yre-slider:has(.yre-track > div:only-child) .yre-ctl{display:none!important}

.yre-slider:has(img[src*="in-ontwikkeling"]) .yre-shade,.yre-panel-open:has(img[src*="in-ontwikkeling"]) .yre-shade{display:none!important}
@media (min-width: 761px){.yre-hero-ui{padding-bottom:clamp(16px,1.8vw,28px)!important}.yre-hero-ui>div:last-child>div:first-child{gap:12px!important}.yre-hero-ui>div:last-child>div:first-child>a{margin-top:6px!important}}
.yre-slider:has(.yre-track > div:only-child){cursor:default!important}
@media (max-width: 760px){img[src$="cartesius-in-ontwikkeling-nl.jpg"]{content:url(/assets/img/cartesius-in-ontwikkeling-nl-sq.jpg)}img[src$="cartesius-in-ontwikkeling-en.jpg"]{content:url(/assets/img/cartesius-in-ontwikkeling-en-sq.jpg)}}

    </nav>
  </header>

  <!-- Hero slider -->
  <section id="top" aria-roledescription="carousel" aria-label="Projectbeelden" style="width: 100%">
    <div class="yre-reveal yre-slider" onMouseEnter="{{ pause }}" onMouseLeave="{{ resume }}" onPointerDown="{{ down }}" onPointerMove="{{ move }}" onPointerUp="{{ up }}" onPointerCancel="{{ up }}" style="position: relative; height: clamp(360px, min(82vh, 60vw), 880px); overflow: hidden; background: #2C2B28; color: #F3F1EC; touch-action: pan-y; user-select: none; -webkit-user-select: none">

      <div class="yre-track" onTransitionEnd="{{ settle }}" style="display: flex; height: 100%; will-change: transform; transform: {{ trackTf }}; transition: {{ trackTr }}">
        <sc-for list="{{ trackSlides }}" as="s" hint-placeholder-count="4">
          <div aria-roledescription="slide" aria-label="{{ s.label }}" style="flex: 0 0 100%; height: 100%; position: relative">
            <img src="{{ s.src }}" alt="{{ s.alt }}" draggable="false" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{ s.pos }}; display: block; pointer-events: none">
          </div>
        </sc-for>
      </div>

      <div class="yre-shade" aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(18,18,17,0.74) 0%, rgba(18,18,17,0) 52%), linear-gradient(to bottom, rgba(18,18,17,0.4) 0%, rgba(18,18,17,0) 22%)"></div>

      <div class="yre-hero-ui" style="position: absolute; inset: 0; pointer-events: none; padding: clamp(28px, 3.4vw, 52px) max(clamp(20px, 4vw, 56px), calc((100% - 1440px) / 2 + 56px)); box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
        <div class="yre-up yre-d1" style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; font-size: 13px; letter-spacing: 0.06em">
          <span style="display: inline-flex; align-items: center; gap: 8px; text-transform: uppercase; color: #D6D2CA">
            <svg width="11" height="15" viewBox="0 0 12 16" aria-hidden="true" style="flex: none; color: #F3F1EC"><path fill="currentColor" fill-rule="evenodd" d="M6 0C2.69 0 0 2.62 0 5.86 0 10.1 6 16 6 16s6-5.9 6-10.14C12 2.62 9.31 0 6 0zm0 8.4a2.55 2.55 0 1 1 0-5.1 2.55 2.55 0 0 1 0 5.1z"></path></svg>
            Kiel, DE
          </span>
        </div>

        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 28px">
          <div style="display: flex; flex-direction: column; gap: 20px; min-width: 0">
            <h1 class="yre-up yre-d2" style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 500; font-stretch: 86%; font-size: clamp(36px, 4.4vw, 68px); line-height: 0.9; letter-spacing: -0.04em">KoolKiel</h1>
            <span class="yre-up yre-d3" style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #D6D2CA">Kiel — In aanbouw</span>
            <a href="/projecten" class="yre-up yre-d3" style="pointer-events: auto; color: #F3F1EC; align-self: flex-start; margin-top: 10px; display: inline-flex; align-items: center; gap: 14px; min-height: 44px; font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; border-bottom: 1px solid #F3F1EC">Alle projecten</a>
          </div>

          <div class="yre-up yre-d3" style="pointer-events: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 18px">
            <div style="display: flex; align-items: center; gap: 18px">
              <button type="button" class="yre-ctl" onClick="{{ prev }}" aria-label="Vorige afbeelding">
                <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><path d="M17 6H1M6 1L1 6l5 5" stroke="currentColor" stroke-width="1.2" fill="none"></path></svg>
              </button>
              <button type="button" class="yre-ctl" onClick="{{ next }}" aria-label="Volgende afbeelding">
                <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><path d="M1 6h16M12 1l5 5-5 5" stroke="currentColor" stroke-width="1.2" fill="none"></path></svg>
              </button>
            </div>
            <div aria-hidden="true" style="position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none">
              <sc-for list="{{ slides }}" as="s" hint-placeholder-count="4">
                <button type="button" tabindex="-1" onClick="{{ s.go }}" aria-label="{{ s.label }}" aria-current="{{ s.aria }}" style="all: unset; cursor: pointer; flex: 1 1 0; padding: 10px 0; box-sizing: border-box">
                  <span style="display: block; position: relative; height: 2px; background: rgba(243,241,236,0.28); overflow: hidden">
                    <sc-if value="{{ s.done }}" hint-placeholder-val="{{ false }}">
                      <span style="position: absolute; inset: 0; background: #F3F1EC"></span>
                    </sc-if>
                    <sc-if value="{{ s.active }}" hint-placeholder-val="{{ false }}">
                      <span class="yre-seg" onAnimationEnd="{{ auto }}" style="position: absolute; inset: 0; background: #F3F1EC; animation-play-state: {{ playState }}"></span>
                    </sc-if>
                  </span>
                </button>
              </sc-for>
            </div>
          </div>
        </div>
      </div>
    </div>
    <p class="yre-credit" aria-live="polite" style="max-width: 1440px; margin: 0 auto; padding: 12px clamp(20px, 4vw, 56px) 0; box-sizing: border-box; font-size: 12px; line-height: 1.5; letter-spacing: 0.01em; color: #6B675F">{{ credit }}</p>
  </section>

  <!-- Phase -->
  <section aria-label="Projectfase" style="max-width: 1440px; margin: 0 auto; padding: clamp(48px, 5vw, 72px) clamp(20px, 4vw, 56px) 0; box-sizing: border-box">
    <div style="display: flex; flex-wrap: wrap; gap: 20px clamp(32px, 5vw, 80px); align-items: flex-start">
      <div style="flex: 1 1 560px; min-width: 0">
        <div style="position: relative; padding-top: 14px">
          <div class="yre-phasetrack" aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 14px; height: 1px; background: #CFCAC0"></div>
          <div aria-hidden="true" class="yre-phasefill yre-phasetrack" style="position: absolute; left: 0; top: 13px; height: 3px; background: #121211; width: {{ phaseFill }}"></div>
          <ol class="yre-phases" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); column-gap: 24px">
            <sc-for list="{{ phases }}" as="ph" hint-placeholder-count="7">
              <li class="yre-phase" aria-current="{{ ph.aria }}" style="display: flex; flex-direction: column; gap: 14px; position: relative">
                <span aria-hidden="true" style="width: 11px; height: 11px; box-sizing: border-box; border: 1px solid #121211; background: {{ ph.dot }}; margin-top: -5px; position: relative"></span>
                <span style="font-size: 14px; line-height: 1.3; color: {{ ph.color }}; font-weight: {{ ph.weight }}; hyphens: manual; -webkit-hyphens: manual; overflow-wrap: break-word; min-width: 0">{{ ph.name }}</span>
                <sc-if value="{{ ph.current }}" hint-placeholder-val="{{ false }}">
                  <span style="align-self: flex-start; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; background: #121211; color: #F3F1EC; padding: 4px 8px">Huidig</span>
                </sc-if>
              </li>
            </sc-for>
          </ol>
        </div>
      </div>
    </div>
  </section>

  <!-- Key facts -->
  <section style="max-width: 1440px; margin: 0 auto; padding: clamp(96px, 10vw, 152px) clamp(20px, 4vw, 56px) 0; box-sizing: border-box">
    <div ref="{{ factsRef }}" data-yre-facts="1" style="display: flex; flex-wrap: wrap; gap: 24px clamp(32px, 5vw, 80px); align-items: flex-start">
      <dl class="yre-facts" style="flex: 1 1 560px; min-width: 0; margin: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: clamp(20px, 2.5vw, 40px); row-gap: 40px">
        <sc-for list="{{ allFacts }}" as="f" hint-placeholder-count="6">
          <div class="yre-fact" style="grid-column: span {{ f.span }}; position: relative; padding-top: 24px; display: flex; flex-direction: column-reverse; justify-content: flex-end; gap: 14px; min-width: 0">
            <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 1px; background: #CFCAC0"></div>
            <div aria-hidden="true" style="position: absolute; left: 0; top: 0; height: 1px; background: #121211; width: {{ f.line }}"></div>
            <dt style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #5F5B54; line-height: 1.4">{{ f.label }}</dt>
            <dd style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 500; font-stretch: 86%; font-size: clamp(44px, 4.4vw, 72px); line-height: 0.95; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; white-space: nowrap"><span aria-hidden="true">{{ f.shown }}</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{ f.full }}</span><span aria-hidden="true" style="font-size: 0.4em; letter-spacing: 0; margin-left: 4px; vertical-align: 0.95em">{{ f.unit }}</span></dd>

        </sc-for>
        <div class="yre-fact" style="grid-column: span 8; position: relative; padding-top: 24px; display: flex; flex-direction: column-reverse; justify-content: flex-end; gap: 14px; min-width: 0">
          <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 1px; background: #CFCAC0"></div>
          <div aria-hidden="true" style="position: absolute; left: 0; top: 0; height: 1px; background: #121211; width: {{ progLine }}"></div>
          <dt style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #5F5B54; line-height: 1.4">Programma</dt>
          <dd style="margin: 0; min-height: clamp(42px, 4.2vw, 68px); display: flex; align-items: flex-end">

              <li>Hotel<span aria-hidden="true" style="color: #A8A399; margin: 0 0.45em">/</span></li>
              <li>Gemengd gebruik<span aria-hidden="true" style="color: #A8A399; margin: 0 0.45em">/</span></li>
              <li>Retail<span aria-hidden="true" style="color: #A8A399; margin: 0 0.45em">/</span></li>

  </section>

  <!-- The project -->
  <section style="max-width: 1440px; margin: 0 auto; padding: clamp(96px, 10vw, 152px) clamp(20px, 4vw, 56px) 0; box-sizing: border-box">
    <div style="display: flex; flex-wrap: wrap; gap: 24px clamp(32px, 5vw, 80px); align-items: flex-start">
      <div style="flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 36px">
        <h2 style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 500; font-stretch: 88%; font-size: clamp(36px, 4.4vw, 64px); line-height: 1.02; letter-spacing: -0.03em; max-width: 920px">Van havenloods naar een creatief, gemengd stadskwartier.</h2>
        <div style="display: flex; flex-direction: column; gap: 20px; max-width: 680px">
          <p style="margin: 0; font-size: 18px; line-height: 1.6">KoolKiel transformeert een voormalig industrieel haventerrein nabij de zuidpunt van de Kieler Förde tot een gemengd stadskwartier van 86.000 m². Op de locatie staat het W8 Medienzentrum — een voormalige opslaghal voor scheepskettingen waar vanaf begin jaren tachtig de beroemde Duitse Werner-strips werden gedrukt, en vandaag een thuisbasis voor media- en creatieve bedrijven.</p>
          <p style="margin: 0; font-size: 18px; line-height: 1.6">Het plan houdt die creatieve en sociale diversiteit centraal. Een commerciële plint draagt short-stay appartementen rond een verhoogde binnenhof, het gebouw Wulf voegt 154 sociale huurwoningen toe in drie kubusvormige blokken, en W1 voltooit de locatie met twee hoteltorens — waarvan één met uitkragende volumes een nieuw herkenningspunt vormt met uitzicht over de Förde.</p>
          <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.6; font-weight: 500"><a href="https://www.mvrdv.com/projects/378/koolkiel" target="_blank" rel="noopener" style="text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px">Meer over KoolKiel</a></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Project team -->
  <section style="max-width: 1440px; margin: 0 auto; padding: clamp(96px, 10vw, 152px) clamp(20px, 4vw, 56px) 0; box-sizing: border-box">
    <div style="display: flex; flex-wrap: wrap; gap: 24px clamp(32px, 5vw, 80px); align-items: flex-start">
      <div style="flex: 1 1 560px; min-width: 0">

            <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 24px; border-top: 1px solid #CFCAC0; padding: 22px 0">
              <dt style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #5F5B54">{{ t.role }}</dt>
              <dd style="margin: 0; display: inline-flex; align-items: center; gap: 10px; font-size: clamp(18px, 1.5vw, 22px); text-align: right; font-weight: {{ t.weight }}">

                  <span aria-hidden="true" style="width: 8px; height: 8px; background: #121211; flex: none"></span>

                <sc-if value="{{ t.hasLink }}" hint-placeholder-val="{{ false }}"><a href="{{ t.href }}" target="_blank" rel="noopener" style="border-bottom: 1px solid #A8A399">{{ t.name }}</a></sc-if>
                <sc-if value="{{ t.noLink }}" hint-placeholder-val="{{ true }}"><span>{{ t.name }}</span></sc-if>
              </dd>
            </div>
          </sc-for>
        </dl>
        <div aria-hidden="true" style="height: 1px; background: #CFCAC0"></div>
        <p style="margin: 20px 0 0; font-size: 13px; line-height: 1.6; color: #5F5B54; max-width: 560px">Eigen bijdrage: Architect / ontwerpteam, tijdens dienstverband bij MVRDV.</p>
      </div>

  <!-- Next project -->
  <section style="margin-top: clamp(112px, 12vw, 176px); background: #121211; color: #F3F1EC">
    <div class="yre-next">
      <a href="/projecten/ikaria" style="color: #F3F1EC; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 32px; max-width: 1440px; margin: 0 auto; padding: clamp(56px, 7vw, 104px) clamp(20px, 4vw, 56px); box-sizing: border-box">
        <div style="display: flex; flex-direction: column; gap: 28px">
          <span style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #A8A399">Volgend project</span>
          <span style="font-family: 'Archivo', sans-serif; font-weight: 500; font-stretch: 86%; font-size: clamp(52px, 7vw, 112px); line-height: 0.92; letter-spacing: -0.04em">Ikaria</span>
          <span style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #D6D2CA">Cartesius Utrecht — Bouwvoorbereiding</span>
        </div>
          <div class="yre-next-img" aria-hidden="true"><img src="/assets/img/cartesius-in-ontwikkeling-nl.jpg" alt="" loading="lazy"></div>
      </a>
    </div>

    <footer style="max-width: 1440px; margin: 0 auto; padding: 28px clamp(20px, 4vw, 56px) 40px; box-sizing: border-box; border-top: 1px solid #3A3935; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px; font-size: 13px; color: #A8A399">
      <img src="/assets/img/brand/mark-white.png" alt="Y/RE" style="height: 20px; width: auto; display: block">
      <nav aria-label="Voettekst" style="display: flex; flex-wrap: wrap; gap: 28px">
        <a href="mailto:info@yre-development.nl" style="color: #D6D2CA">info@yre-development.nl</a>
          <a href="/privacy" style="color: #D6D2CA">Privacy</a>
      </nav>
      <span>© 2026 Y/RE Development · KvK 94645108</span>

</div>
</template>
<script type="module">
import { DCLogic, mount } from '/assets/dc.js';

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { p: 0, started: false, idx: 0, pos: 0, jump: false, paused: false, dx: 0, dragging: false };
    this.images = [
      { src: '/assets/img/koolkiel/kk-1.jpg', alt: 'KoolKiel-toren van gestapelde, verlichte volumes bij schemering, gezien vanuit een park', credit: 'KoolKiel · Architectuur: MVRDV · Beeld: © MVRDV' },
      { src: '/assets/img/koolkiel/kk-2.jpg', alt: 'Luchtfoto van KoolKiel met twee torens en een lang blok met kleurrijke daken langs een tramlijn', credit: 'KoolKiel · Architectuur: MVRDV · Beeld: © MVRDV' },
      { src: '/assets/img/koolkiel/kk-3.jpg', alt: 'Straatbeeld van de KoolKiel-torens met een tramhalte op de voorgrond', credit: 'KoolKiel · Architectuur: MVRDV · Beeld: © MVRDV' }
    ];
    this.facts = [
      { value: 86000, dec: 0, unit: 'm² BVO', label: 'Totaal' }
    ];
    this.mix = [];
    this.phaseNames = ['Initiatief', 'Haalbaarheid', 'Ontwerp', 'Vergunning', 'Bouw\u00ADvoorbereiding', 'Realisatie', 'Oplevering'];
    this.currentPhase = 5;
    this.team = [
      { role: 'Ontwikkelaar', name: 'Adore Gruppe' },
      { role: 'Architect', name: 'MVRDV' },
      { role: 'Aannemer', name: 'Johann Bunte Bauunternehmung' }
    ];
    this.factsRef = (el) => { this._el = el; };
    this._drag = null;
  }

  componentDidMount() {
    // Count on every visit: start automatically shortly after the page loads.
    this._wait = setTimeout(() => {
      this.run();
      this._visibleAtRun = this.inView();
    }, 1200);

    // If the facts were below the fold at that moment, count again the first time they scroll into view.
    this._ioT = setTimeout(() => {
      const el = this._el || (typeof document !== 'undefined' ? document.querySelector('[data-yre-facts]') : null);
      if (!el || typeof IntersectionObserver === 'undefined') return;
      this._el = el;
      this._io = new IntersectionObserver((entries) => {
        if (!entries.some((e) => e.isIntersecting)) return;
        if (this._visibleAtRun === undefined) return;
        this._io.disconnect();
        if (!this._visibleAtRun) this.run();
      }, { threshold: 0.3 });
      this._io.observe(el);
    }, 1300);

    this._phaseT = setTimeout(() => this.setState({ phaseOn: true }), 900);
  }

  inView() {
    const el = this._el || (typeof document !== 'undefined' ? document.querySelector('[data-yre-facts]') : null);
    if (!el || typeof window === 'undefined') return true;
    const r = el.getBoundingClientRect();
    return r.top < window.innerHeight * 0.85 && r.bottom > 0;
  }

  componentWillUnmount() {
    if (this._io) this._io.disconnect();
    if (this._raf) cancelAnimationFrame(this._raf);
    clearTimeout(this._wait);
    clearTimeout(this._ioT);
    clearTimeout(this._phaseT);
  }

  run() {
    if (this._raf) cancelAnimationFrame(this._raf);
    const reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { this.setState({ p: 1, started: true }); return; }
    this.setState({ p: 0, started: true });
    const t0 = performance.now();
    const D = 2600;
    const tick = (now) => {
      const p = Math.min(1, (now - t0) / D);
      this.setState({ p: p });
      if (p < 1) this._raf = requestAnimationFrame(tick);
    };
    this._raf = requestAnimationFrame(tick);
  }

  goTo(i) {
    const n = this.images.length;
    const k = ((i % n) + n) % n;
    this.setState({ idx: k, pos: k, jump: false, dx: 0 });
  }

  // endless carousel: step one slide; clones at both ends make the wrap seamless
  step(d) {
    const n = this.images.length;
    if (n < 2) return;
    let pos = this.state.pos || 0;
    // three copies of the slides are rendered; only renormalise if we would run off the outer copies
    if (pos + d < -n || pos + d > 2 * n - 1) pos = ((pos % n) + n) % n;
    const next = pos + d;
    this.setState({ pos: next, idx: ((next % n) + n) % n, jump: false, dx: 0 });
  }

  renderVals() {
    const n = this.images.length;
    const idx = this.state.idx || 0;

    const credit = (this.images[idx] && this.images[idx].credit) || '';
    const slides = this.images.map((img, i) => ({
      src: img.src,
      alt: img.alt,
      pos: img.pos || 'center',
      label: 'Afbeelding ' + (i + 1) + ' van ' + n,
      active: i === idx,
      done: i < idx,
      aria: i === idx ? 'true' : 'false',
      go: () => this.goTo(i)
    }));

    const down = (e) => {
      if (n < 2) return;
      if (e.button !== undefined && e.button !== 0) return;
      if (e.target && e.target.closest && e.target.closest('button, a')) return;
      const w = e.currentTarget.offsetWidth || 1;
      // start from where the track is right now, also halfway through a slide transition
      let pos = this.state.pos || 0, base = 0;
      const tr = e.currentTarget.querySelector('.yre-track');
      if (tr && typeof DOMMatrix !== 'undefined') {
        try {
          // shift by whole copies (visually identical) so the drag always starts in the middle copy
          const f = (((-new DOMMatrix(getComputedStyle(tr).transform).m41 / w - n) % n) + n) % n;
          pos = Math.round(f); base = (pos - f) * w;
        } catch (err) {}
      }
      this._drag = { x0: e.clientX, w: w, base: base };
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
      this.setState({ dragging: true, pos: pos, idx: ((pos % n) + n) % n, dx: base, paused: true });
    };
    const move = (e) => {
      if (!this._drag) return;
      this.setState({ dx: this._drag.base + (e.clientX - this._drag.x0) });
    };
    const up = () => {
      if (!this._drag) return;
      const dx = (this.state.dx || 0) - this._drag.base;
      const limit = Math.min(60, this._drag.w * 0.1);
      this._drag = null;
      if (dx < -limit) { this.setState({ dragging: false, paused: false }); this.step(1); }
      else if (dx > limit) { this.setState({ dragging: false, paused: false }); this.step(-1); }
      else this.setState({ dx: 0, dragging: false, paused: false });
    };

    const p = this.state.p || 0;
    const fmt = (v, dec) => v.toLocaleString('nl-NL', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    const facts = this.facts.map((f, i) => {
      const local = Math.max(0, Math.min(1, (p - i * 0.1) / 0.62));
      const e = 1 - Math.pow(1 - local, 4);
      return {
        label: f.label,
        unit: f.unit,
        shown: fmt(f.value * e, f.dec),
        full: fmt(f.value, f.dec) + (f.unit ? ' ' + f.unit : ''),
        line: (e * 100).toFixed(2) + '%'
      };
    });

    const totalHomes = this.mix.reduce((a, m) => a + m.homes, 0);
    const mLocal = Math.max(0, Math.min(1, (p - 0.3) / 0.7));
    const me = 1 - Math.pow(1 - mLocal, 4);
    // Whole-number shares that still add up to 100 (largest remainder).
    const raw = this.mix.map((m) => (m.homes / totalHomes) * 100);
    const whole = raw.map(Math.floor);
    let left = 100 - whole.reduce((a, v) => a + v, 0);
    raw.map((v, i) => ({ i: i, r: v - Math.floor(v) })).sort((x, y) => y.r - x.r).forEach((o) => { if (left > 0) { whole[o.i] += 1; left -= 1; } });
    const mix = this.mix.map((m, i) => {
      const pct = whole[i];
      return {
        label: m.label,
        color: m.color,
        homes: m.homes + ' woningen',
        pct: fmt(pct * me, 0),
        pctFull: pct + '%',
        w: (pct * me).toFixed(3) + '%'
      };
    });

    const cur = this.currentPhase;
    const total = this.phaseNames.length;
    const phases = this.phaseNames.map((name, i) => ({
      name: name,
      current: i === cur,
      aria: i === cur ? 'step' : 'false',
      dot: i <= cur ? '#121211' : '#F3F1EC',
      color: i <= cur ? '#121211' : '#5F5B54',
      weight: i === cur ? 600 : 400
    }));

    const team = this.team.map((t) => ({ ...t, yre: !!t.yre, weight: t.yre ? 600 : 400, hasLink: !!t.href, noLink: !t.href }));

    return {
      slides: slides,
      credit: credit,
      counter: '0' + (idx + 1),
      total: '0' + n,
      trackSlides: n > 1 ? this.images.concat(this.images, this.images).map((img) => ({ src: img.src, alt: img.alt, pos: img.pos || 'center', label: '' })) : slides,
      trackTf: 'translateX(calc(' + (-((this.state.pos || 0) + (n > 1 ? n : 0)) * 100) + '% + ' + (this.state.dx || 0) + 'px))',
      trackTr: (this.state.dragging || this.state.jump) ? 'none' : 'transform .7s cubic-bezier(.2,.7,.1,1)',
      settle: (e) => {
        if (e && e.target !== e.currentTarget) return;
        const pos = this.state.pos || 0;
        if (pos >= n) this.setState({ pos: pos - n, jump: true });
        else if (pos < 0) this.setState({ pos: pos + n, jump: true });
      },
      playState: (this.state.paused || this.state.dragging) ? 'paused' : 'running',
      prev: () => this.step(-1),
      next: () => this.step(1),
      auto: () => this.step(1),
      pause: () => this.setState({ paused: true }),
      resume: () => { if (!this._drag) this.setState({ paused: false }); },
      down: down,
      move: move,
      up: up,
      facts: facts,
      allFacts: facts.map((f) => ({ ...f, span: 4 })),
      progLine: facts[0] ? facts[0].line : '0%',
      factsRef: this.factsRef,
      phases: phases,
      phaseFill: this.state.phaseOn ? 'calc(' + ((cur / total) * 100).toFixed(3) + '% + ' + ((cur * 24) / total + 11).toFixed(2) + 'px)' : '0px',
      team: team
    };
  }
}

mount(Component, {});
</script>
